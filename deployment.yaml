
apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-lms
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: university-lms
  template:
    metadata:
      labels:
        app: university-lms
    spec:
      containers:
        - name: university-lms
          image: balaji00002/university-lms-portal:v1
          ports:
            - containerPort: 80
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - grep -q 'LMS-HEALTHY' /usr/share/nginx/html/index.html
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - grep -q 'LMS-HEALTHY' /usr/share/nginx/html/index.html
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: university-lms-service
spec:
  type: NodePort
  selector:
    app: university-lms
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
